<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatham Subaru | Launch Dashboard</title>
  <style>
    :root { --navy:#1F3552; --navy-dark:#152540; --gold:#C08A2E; --bg:#F4F6F8; --card:#fff; --border:#E2E6EA; --text:#1A1A1A; --muted:#6B7280; --complete:#2F9E63; --complete-bg:#E7F6EE; --progress:#3B82C4; --progress-bg:#E8F1FA; --ready:#0891B2; --ready-bg:#E4F6F8; --waiting:#D97706; --waiting-bg:#FDF1DF; --blocked:#8A8F98; --blocked-bg:#EEEFF1; }
    * { box-sizing:border-box } body { margin:0; color:var(--text); background:var(--bg); font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
    .top { padding:28px 20px 22px; color:#fff; background:linear-gradient(135deg,var(--navy),var(--navy-dark)) }.inner,.wrap { max-width:1180px; margin:auto }.inner { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap }.eyebrow { margin:0 0 6px; color:var(--gold); font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase } h1 { margin:0; font-size:26px }.sub { margin:4px 0 0; color:#c9d4e0 }.progress-block { display:flex; align-items:center; gap:14px }.ring { width:64px; height:64px; position:relative }.ring svg { transform:rotate(-90deg) }.pct { position:absolute; inset:0; display:grid; place-items:center; font-weight:700 }.progress-text { color:#c9d4e0; line-height:1.5 }.progress-text b { color:#fff }
    .wrap { padding:0 20px 60px }.toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:16px 0 }.toolbar select,.toolbar button { padding:8px 12px; color:var(--text); cursor:pointer; background:#fff; border:1px solid var(--border); border-radius:8px }.toolbar button.primary { color:#fff; background:var(--navy); border-color:var(--navy) }.toolbar .spacer { flex:1 }.hint { font-size:12px; color:var(--muted) }
    .stats { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:18px }.stat { padding:12px 14px; cursor:pointer; background:var(--card); border:1px solid var(--border); border-radius:10px }.stat.active { outline:2px solid var(--navy) }.n { font-size:22px; font-weight:700 }.l { margin-top:2px; color:var(--muted); font-size:11px; letter-spacing:.4px; text-transform:uppercase }.total .n{color:var(--navy)}.complete .n{color:var(--complete)}.progress .n{color:var(--progress)}.ready .n{color:var(--ready)}.waiting .n{color:var(--waiting)}.blocked .n{color:var(--blocked)}
    .notice { padding:16px 18px; margin-bottom:24px; border:1px solid #f2d9ae; border-left:4px solid var(--waiting); border-radius:10px; background:var(--waiting-bg) }.notice h2 { margin:0 0 4px; color:#7c4a08; font-size:15px }.notice p { margin:0; color:#8a5a10 }.notice.ok { border-color:#bfe6cf; border-left-color:var(--complete); background:var(--complete-bg) }.notice.ok h2 { color:#1d6b45 }.notice.error { border-color:#f1b5b5; border-left-color:#c0392b; background:#fff0f0 }.notice.error h2,.notice.error p { color:#8d2c23 }
    .platform { overflow:hidden; margin-bottom:16px; background:var(--card); border:1px solid var(--border); border-radius:12px }.plat-head { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 18px; cursor:pointer }.plat-head:hover { background:#fafbfc }.left { display:flex; align-items:center; gap:12px }.dot { width:10px; height:10px; border-radius:50% }.count { color:var(--muted); font-size:12px }.mini { width:140px; height:6px; overflow:hidden; background:var(--border); border-radius:4px }.mini div { height:100%; background:var(--complete) }.chev { color:var(--muted) }.collapsed .body { display:none }.collapsed .chev { transform:rotate(-90deg) }.body { padding:0 18px 18px }.phase { margin-top:14px }.phase-label { display:flex; justify-content:space-between; gap:8px; margin-bottom:5px; color:var(--navy); font-weight:600 }.stack { display:flex; height:10px; overflow:hidden; margin-bottom:8px; background:var(--blocked-bg); border-radius:6px }.stack span { height:100% }
    table { width:100%; border-collapse:collapse; font-size:13px } th { padding:6px 8px; color:var(--muted); font-size:11px; letter-spacing:.4px; text-align:left; text-transform:uppercase; border-bottom:1px solid var(--border) } td { padding:9px 8px; vertical-align:top; border-bottom:1px solid #f0f1f3 }.task { width:31%; font-weight:600 }.detail { width:33%; color:var(--muted) }.owner { width:16%; color:var(--muted) }.status { width:20% }.badge { display:inline-flex; align-items:center; gap:6px; padding:5px 9px; font-size:12px; font-weight:600; border-radius:20px }.badge i { width:7px; height:7px; border-radius:50%; background:currentColor } footer { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; padding-top:16px; margin-top:24px; color:var(--muted); font-size:12px; border-top:1px solid var(--border) }.legend { display:flex; gap:14px; flex-wrap:wrap }.legend span { display:flex; align-items:center; gap:5px }.legend i { width:8px; height:8px; border-radius:50% }
    @media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}} @media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.hide-mobile{display:none}.plat-head{align-items:flex-start}.mini{width:80px}.task{width:50%}.status{width:50%}} @media print{.toolbar,.chev{display:none!important}.collapsed .body{display:block!important}body{background:#fff}}
  </style>
</head>
<body>
  <header class="top"><div class="inner"><div><p class="eyebrow">Onboarding Dashboard</p><h1>Chatham Subaru</h1><p class="sub">Client launch — onboarding checklist &amp; digital ad management</p></div><div class="progress-block"><div class="ring"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="7"/><circle id="ring" cx="32" cy="32" r="27" fill="none" stroke="#C08A2E" stroke-width="7" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg><span class="pct" id="pct">—</span></div><div class="progress-text">Overall progress<br><b id="progressCount">Loading tasks…</b></div></div></div></header>
  <main class="wrap"><div class="toolbar"><label><span class="hint">Filter </span><select id="filter" aria-label="Filter tasks"><option value="all">Show: all tasks</option><option value="waiting">Show: With C4</option><option value="blocked">Show: blocked</option><option value="ready">Show: need to start</option><option value="progress">Show: in progress</option><option value="complete">Show: completed</option></select></label><span class="hint" id="filterHint"></span><span class="spacer"></span><button id="refresh" class="primary">Refresh live data</button><button id="expand">Expand all</button><button id="collapse">Collapse all</button><button id="export">Export CSV</button><button onclick="window.print()">Print / Save PDF</button></div><section class="stats" id="stats" aria-label="Task summary"></section><section class="notice" id="notice" aria-live="polite"><h2>Loading live Asana data</h2><p>Please wait while the dashboard connects.</p></section><div id="platforms"></div><footer><div class="legend" id="legend"></div><div>Read-only dashboard · Last refreshed <span id="updated">—</span></div></footer></main>
  <script>
    const API='https://xgmkiklcaksywdhktjcb.supabase.co/rest/v1/launch_tasks?select=*&section_name=in.(Onboarding%20Check%20List,Digital%20Ad%20Management)&order=section_order,phase_order,task_order';
    const KEY='sb_publishable_dFQNva3qNWuFFzgif3CVdw_VXDY8w2C';
    const S={complete:{label:'Completed',color:'#2F9E63',bg:'#E7F6EE'},progress:{label:'In Progress',color:'#3B82C4',bg:'#E8F1FA'},ready:{label:'Need to start',color:'#0891B2',bg:'#E4F6F8'},waiting:{label:'With C4',color:'#D97706',bg:'#FDF1DF'},blocked:{label:'Blocked',color:'#8A8F98',bg:'#EEEFF1'}};
    let rows=[], filter='all'; const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(){const visible=filter==='all'?rows:rows.filter(r=>r.status===filter), counts=Object.fromEntries(['complete','progress','ready','waiting','blocked'].map(k=>[k,rows.filter(r=>r.status===k).length])), done=counts.complete||0, total=rows.length, percent=total?Math.round(done/total*100):0; $('pct').textContent=total?percent+'%':'—'; $('ring').style.strokeDashoffset=169.6*(1-percent/100); $('progressCount').textContent=total?`${done} / ${total} tasks complete`:'No tasks available'; $('stats').innerHTML=[['total','Total',total],...Object.entries(S).map(([k,v])=>[k,v.label,counts[k]||0])].map(([k,l,n])=>`<button class="stat ${k} ${filter===k?'active':''}" data-filter="${k==='total'?'all':k}" aria-pressed="${filter===(k==='total'?'all':k)}"><div class="n">${n}</div><div class="l">${l}</div></button>`).join(''); $('stats').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{$('filter').value=b.dataset.filter;filter=b.dataset.filter;render()}); const waiting=rows.filter(r=>r.status==='waiting'); $('notice').className='notice '+(waiting.length?'':'ok'); $('notice').innerHTML=waiting.length?`<h2>With C4 (${waiting.length})</h2><p>${waiting.map(r=>esc(r.task_name)).join(' · ')}</p>`:'<h2>No tasks waiting on C4</h2><p>There are currently no items marked With C4.</p>'; const groups=Object.values(visible.reduce((a,r)=>{(a[r.section_name]??=[]).push(r);return a},{})); $('platforms').innerHTML=groups.map(section=>sectionHTML(section)).join('')||'<section class="notice ok"><h2>No matching tasks</h2><p>Choose another filter to see synced work.</p></section>'; document.querySelectorAll('.plat-head').forEach(h=>h.onclick=()=>h.closest('.platform').classList.toggle('collapsed')); $('filterHint').textContent=filter==='all'?'':`${visible.length} matching task${visible.length===1?'':'s'}`; }
    function sectionHTML(section){const name=section[0].section_name,color=section[0].section_color||'#1F3552',complete=section.filter(r=>r.status==='complete').length,pct=section.length?complete/section.length*100:0,phases=Object.values(section.reduce((a,r)=>{const n=r.phase_name||'General';(a[n]??=[]).push(r);return a},{}));return `<section class="platform"><button class="plat-head" type="button" aria-label="Toggle ${esc(name)}"><span class="left"><i class="dot" style="background:${esc(color)}"></i><span><strong>${esc(name)}</strong> <span class="count">${complete} of ${section.length} complete</span></span></span><span class="left"><span class="mini"><span style="display:block;width:${pct}%"></span></span><span class="chev">⌄</span></span></button><div class="body">${phases.map(phaseHTML).join('')}</div></section>`}
    function phaseHTML(items){const name=items[0].phase_name||'General',c=Object.fromEntries(Object.keys(S).map(k=>[k,items.filter(r=>r.status===k).length]));return `<section class="phase"><div class="phase-label"><span>${esc(name)}</span><span class="count">${items.length} task${items.length===1?'':'s'}</span></div><div class="stack">${Object.entries(S).map(([k,v])=>c[k]?`<span style="width:${c[k]/items.length*100}%;background:${v.color}"></span>`:'').join('')}</div><table><thead><tr><th>Task</th><th class="hide-mobile">Notes / dependency</th><th class="hide-mobile">Owner</th><th>Status</th></tr></thead><tbody>${items.map(r=>{const s=S[r.status]||S.ready;return `<tr><td class="task">${esc(r.task_name)}</td><td class="detail hide-mobile">${esc(r.task_detail)||'—'}</td><td class="owner hide-mobile">${esc(r.owner)||'—'}</td><td class="status"><span class="badge" style="color:${s.color};background:${s.bg}"><i></i>${s.label}</span></td></tr>`}).join('')}</tbody></table></section>`}
    async function load(){ $('notice').className='notice'; $('notice').innerHTML='<h2>Refreshing live Asana data</h2><p>Reading the secure Supabase mirror…</p>'; try {const res=await fetch(API,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}}); if(!res.ok)throw Error(`Connection error (${res.status})`); rows=await res.json(); if(!rows.length){$('notice').className='notice error';$('notice').innerHTML='<h2>Live sync has no tasks yet</h2><p>The dashboard is connected, but no rows are available. Check the Asana sync configuration.</p>'} $('updated').textContent=new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date()); render()}catch(e){rows=[];$('notice').className='notice error';$('notice').innerHTML=`<h2>Live data is unavailable</h2><p>${esc(e.message)}. Please try Refresh live data.</p>`;$('platforms').innerHTML='';$('stats').innerHTML='';$('progressCount').textContent='Data unavailable';$('pct').textContent='—'}}
    $('filter').onchange=e=>{filter=e.target.value;render()};$('refresh').onclick=load;$('expand').onclick=()=>document.querySelectorAll('.platform').forEach(x=>x.classList.remove('collapsed'));$('collapse').onclick=()=>document.querySelectorAll('.platform').forEach(x=>x.classList.add('collapsed'));$('export').onclick=()=>{const csv=['Section,Phase,Task,Notes / Dependency,Owner,Status',...rows.map(r=>[r.section_name,r.phase_name||'',r.task_name,r.task_detail||'',r.owner||'',S[r.status]?.label||r.status].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='chatham-subaru-launch-tasks.csv';a.click();URL.revokeObjectURL(a.href)}; $('legend').innerHTML=Object.entries(S).map(([,v])=>`<span><i style="background:${v.color}"></i>${v.label}</span>`).join('');load();
  </script>
</body></html>
